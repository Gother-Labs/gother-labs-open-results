name: Validate public results

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-results-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile validation tooling
        run: python -m compileall -q tools tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate all public bundles
        run: python tools/validate_result.py results/*

      - name: Fail on generated catalog drift
        run: python tools/build_catalog.py --check
